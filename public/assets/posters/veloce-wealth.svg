      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="60%" stop-color="#001F54" />
      <stop offset="100%" stop-color="#034078" />
    </linearGradient>
    <linearGradient id="veloceGold" x1="0%" y1="0%" x2="100%" y2="0%">
